<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SakuraChat</title>
  <style>
    :root {
      --bg-color: rgba(0, 0, 0, 0.7);
      --text-color: white;
      --highlight: #ffd700;
      --green: #90ffb0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-image: url('/static/images/555.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      color: var(--text-color);
      display: flex;
    }

    .history-panel {
      width: 280px;
      background-color: var(--bg-color);
      padding: 20px;
      overflow-y: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .history-panel h2 {
      font-size: 1.5em;
      margin-bottom: 10px;
      border-bottom: 1px solid #444;
      padding-bottom: 5px;
    }

    .history-panel ul {
      list-style: none;
      padding-left: 0;
      flex-grow: 1;
    }

    .history-panel li {
      margin-bottom: 15px;
      background-color: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9em;
    }

    .clear-button {
      position: sticky;
      bottom: 0;
      margin-top: auto;
      padding: 10px;
      background-color: #ff4d4d;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.9em;
      width: 100%;
      z-index: 1;
    }

    .main-content {
      flex: 1;
      padding: 60px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background-color: rgba(0, 0, 0, 0.5);
      min-height: 100vh;
    }

    .points-panel {
      width: 260px;
      background-color: var(--bg-color);
      padding: 20px;
      height: 100vh;
      color: var(--highlight);
      font-size: 1em;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .info-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.1em;
      padding: 8px 0;
    }

    #totalCostDisplay, #pointsDisplay {
      font-weight: bold;
    }

    @keyframes flash {
      0%, 100% { color: var(--highlight); transform: scale(1); }
      50% { color: white; transform: scale(1.3); }
    }

    .flash-points {
      animation: flash 0.6s ease-in-out;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 1em;
      font-weight: bold;
    }

    .chatbox {
      display: flex;
      justify-content: center;
      gap: 10px;
      max-width: 600px;
      width: 100%;
      margin-bottom: 30px;
    }

    .chatbox input[type="text"] {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
    }

    .chatbox button {
      padding: 12px 20px;
      background-color: #ffffff;
      color: #333;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .response {
      margin-top: 20px;
      background-color: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 10px;
      max-width: 600px;
      color: #fff;
      white-space: pre-wrap;
      text-align: center;
    }

    .cost {
      margin-top: 10px;
      font-size: 0.9em;
      color: var(--green);
    }
  </style>
</head>
<body>
  <div class="history-panel">
    <h2>💬 Chat History</h2>
    <ul id="chatHistory"></ul>
    <button class="clear-button" onclick="clearHistory()" type="button">🧹 Clear History</button>
  </div>

  <div class="main-content">
    <h1>SakuraChat</h1>
    <div class="chatbox">
      <input type="text" id="questionInput" placeholder="Type your question..." />
      <button onclick="sendQuestion()">Send</button>
    </div>
    <div class="response" id="responseBox"></div>
    <div class="cost" id="costDisplay"></div>
  </div>

  <div class="points-panel">
    <div class="info-header">
      <span>💰 Cost:</span><span id="totalCostDisplay">$0.000000</span>
    </div>
    <div class="info-header">
      <span>⭐ Points:</span><span id="pointsDisplay">0 pts</span>
    </div>
  </div>

  <script>
    let totalCost = 0;
    let totalPoints = 0;

    window.onload = () => {
      const savedHistory = localStorage.getItem("chatHistory");
      const savedCost = localStorage.getItem("totalCost");
      const savedPoints = localStorage.getItem("totalPoints");
      const chatHistory = document.getElementById("chatHistory");
      const totalCostDisplay = document.getElementById("totalCostDisplay");
      const pointsDisplay = document.getElementById("pointsDisplay");

      if (savedHistory) {
        const historyList = JSON.parse(savedHistory);
        historyList.forEach(item => {
          const li = document.createElement("li");
          li.innerHTML = `<strong>You:</strong> ${item.question}<br/><strong>AI:</strong> ${item.reply}`;
          chatHistory.appendChild(li);
        });
      }

      if (savedCost) {
        totalCost = parseFloat(savedCost);
        totalCostDisplay.innerText = "$" + totalCost.toFixed(6);
      }

      if (savedPoints) {
        totalPoints = parseInt(savedPoints);
        pointsDisplay.innerText = `${totalPoints} pts`;
      }

      document.getElementById("questionInput").addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          sendQuestion();
        }
      });
    };

    async function sendQuestion() {
      const question = document.getElementById("questionInput").value.trim();
      const responseBox = document.getElementById("responseBox");
      const costDisplay = document.getElementById("costDisplay");
      const totalCostDisplay = document.getElementById("totalCostDisplay");
      const pointsDisplay = document.getElementById("pointsDisplay");
      const chatHistory = document.getElementById("chatHistory");

      if (!question) {
        responseBox.innerText = "⚠️ Please enter your question.";
        costDisplay.innerText = "";
        return;
      }

      responseBox.innerText = "⏳ Processing...";
      costDisplay.innerText = "";

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });

        const data = await res.json();
        const cost = parseFloat(data.cost.replace('$', ''));

        responseBox.innerText = "🤖 " + data.reply;
        costDisplay.innerText = "💸 Estimated cost: " + data.cost;

        totalCost += cost;
        totalCostDisplay.innerText = "$" + totalCost.toFixed(6);

        const earnedPoints = Math.floor(cost * 100000);
        totalPoints += earnedPoints;
        pointsDisplay.innerText = `${totalPoints} pts`;

        pointsDisplay.classList.add("flash-points");
        setTimeout(() => {
          pointsDisplay.classList.remove("flash-points");
        }, 600);

        const li = document.createElement("li");
        li.innerHTML = `<strong>You:</strong> ${question}<br/><strong>AI:</strong> ${data.reply}`;
        chatHistory.appendChild(li);

        const currentHistory = localStorage.getItem("chatHistory");
        const historyArray = currentHistory ? JSON.parse(currentHistory) : [];
        historyArray.push({ question, reply: data.reply });
        localStorage.setItem("chatHistory", JSON.stringify(historyArray));
        localStorage.setItem("totalCost", totalCost.toFixed(6));
        localStorage.setItem("totalPoints", totalPoints);
      } catch (err) {
        responseBox.innerText = "❌ Error communicating with AI.";
        costDisplay.innerText = "";
        console.error(err);
      }
    }

    function clearHistory() {
      localStorage.removeItem("chatHistory");
      localStorage.removeItem("totalCost");
      localStorage.removeItem("totalPoints");
      document.getElementById("chatHistory").innerHTML = "";
      document.getElementById("totalCostDisplay").innerText = "$0.000000";
      document.getElementById("pointsDisplay").innerText = "0 pts";
      document.getElementById("responseBox").innerText = "";
      document.getElementById("costDisplay").innerText = "";
      totalCost = 0;
      totalPoints = 0;
    }
  </script>
</body>
</html>
