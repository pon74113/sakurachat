
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SakuraChat</title>
</head>
<body>
  <h1>SakuraChat</h1>
  <input type="text" id="questionInput" placeholder="Ask me anything">
  <button onclick="sendQuestion()">Send</button>
  <div id="responseBox"></div>

<script>
function sendQuestion() {
  const input = document.getElementById("questionInput");
  const question = input.value.trim();
  const responseBox = document.getElementById("responseBox");

  if (!question) {
    responseBox.innerText = "Please enter a question.";
    return;
  }

  responseBox.innerText = "Loading...";

  fetch("/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question })
  })
  .then(res => res.json())
  .then(data => {
    responseBox.innerText = data.reply + "\n(Cost: " + data.cost + ")";
  })
  .catch(err => {
    responseBox.innerText = "❌ Failed to contact AI.";
  });
}
</script>
</body>
</html>
